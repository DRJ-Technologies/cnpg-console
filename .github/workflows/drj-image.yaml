# Fork-local image build.
#
# Upstream's release.yaml only fires on v* tags and pushes to
# ghcr.io/firemanxbr/... We need an image from a branch, in our own registry,
# so this is kept separate to keep the fork's diff against upstream readable.
#
# Target is ECR, not GHCR: the EKS nodes that run this already pull from
# 202011926204.dkr.ecr.us-west-2 via their instance role, so nothing has to be
# stored in the cluster. GHCR would have meant a private-package pull secret
# tied to a personal token. Auth here is GitHub OIDC -> IAM role assumption,
# so there are no long-lived AWS keys in this repo either.
name: DRJ image

on:
  workflow_dispatch:
  push:
    branches: ["drj/**"]

permissions:
  contents: read
  id-token: write # required to mint the OIDC token AWS trusts

env:
  AWS_REGION: us-west-2
  ECR_REPO: 202011926204.dkr.ecr.us-west-2.amazonaws.com/platform/cnpg-console

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::202011926204:role/drj-cnpg-console-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REPO }}
          # SHA ONLY. The repository is imageTagMutability=IMMUTABLE, so a
          # mutable tag like the branch name fails on the second push.
          tags: type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
