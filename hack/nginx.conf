worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Temp paths for non-root
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Kubernetes API upstream defaults to the in-cluster API below. To serve a
    # DIFFERENT cluster than the one this pod runs in, mount a rendered copy of
    # this file (see the Helm chart's `apiServer.url` value). Upstream hostnames
    # here are literals, so nginx resolves them once at startup; a cross-cluster
    # render should also set `resolver <kube-dns ClusterIP> valid=30s;` and use a
    # variable in proxy_pass, because an external endpoint's addresses can change
    # under a long-lived process.

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Runtime configuration for the SPA (OIDC issuer, client id, scopes).
        # Mounted from a ConfigMap so issuer/client changes never require an
        # image rebuild. Never cached — a stale config.json silently breaks login.
        location = /config.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
            try_files /config.json =404;
        }

        # ── Kubernetes API ────────────────────────────────────────────────
        # BOTH of these are required. `/api/` covers the core group
        # (/api/v1/pods, namespaces, events...) and `/apis/` covers every
        # named API group — which is where ALL CloudNativePG resources live
        # (/apis/postgresql.cnpg.io/v1/clusters). Upstream shipped only
        # `location /api/`, so every CNPG request fell through to the SPA
        # fallback below and returned index.html, which the frontend then
        # tried to JSON.parse. Listing a cluster could never work.
        location /api/ {
            proxy_pass https://kubernetes.default.svc;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept $http_accept;
            proxy_set_header Content-Type $http_content_type;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /apis/ {
            proxy_pass https://kubernetes.default.svc;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept $http_accept;
            proxy_set_header Content-Type $http_content_type;
            proxy_connect_timeout 5s;
            # Watches are long-lived streams; the 30s default cut them off.
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── OIDC token exchange ───────────────────────────────────────────
        # Proxied same-origin on purpose. The browser POSTs the PKCE code here
        # instead of directly to the issuer, so the issuer's CORS allowlist
        # does not need an entry for this host. The authorization request
        # itself is a top-level navigation and is not subject to CORS.
        location = /oidc/token {
            proxy_pass https://auth.drj.ninja/oauth2/token;
            proxy_ssl_server_name on;
            proxy_set_header Host auth.drj.ninja;
            proxy_set_header Content-Type $http_content_type;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Cache static assets. Must precede the SPA fallback.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SvelteKit SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
